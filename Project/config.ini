[global_test_settings]
name = kernel_log
tools = iperf, irtt
cca = cubic
offline = false
upload = false
kernel_log = true

[iperf_server]
port = 5201
interval = 1
format = m
json = true
logfile = output.log
verbose = false

[iperf_client]
interval = 0.1
json = true
logfile = output.log
duration = 10
host = 10.200.0.2
omit = 0
cca = cubic

[irtt_client]
host = 10.200.0.2
interval = 10ms